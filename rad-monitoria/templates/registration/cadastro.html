{% extends "base.html" %}

{% block titulo %}
Criar conta
{% endblock %}

{% block conteudo %}

<div class="cabecalho-pagina">
    <h1>Criar conta</h1>
</div>

<div class="form-container">

    <h2>Entre para a comunidade</h2>

    <p class="disciplina">
        Crie uma conta para abrir e acompanhar suas dúvidas.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Criar conta
        </button>

    </form>

    <br>

    <a
        style="color: #1d9bf0;"
        href="{% url 'login' %}"
    >
        Já tenho uma conta
    </a>

</div>

{% endblock %}
